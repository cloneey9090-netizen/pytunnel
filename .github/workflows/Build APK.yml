name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug - mostrar estrutura
        run: |
          echo "=== ARQUIVOS NA RAIZ ==="
          ls -la
          echo "=== pyproject.toml ==="
          cat pyproject.toml || echo "⚠️ Não encontrado"
          echo "=== assets ==="
          ls -la assets/ || echo "⚠️ Pasta não encontrada"

      - name: Instalar Flet e dependências
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.0
          pip install -e .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Gerar APK com Flet
        run: |
          flet build apk --verbose

      - name: Listar APK gerado
        run: |
          find build -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pytunnel-apk
          path: build/apk/*.apk
          if-no-files-found: error
